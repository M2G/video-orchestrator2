name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule l'exécution précédente d'une même branche quand un nouveau push arrive
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # PostgreSQL jetable pour le test @SpringBootTest (contextLoads)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: video_jobs_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Create database schema
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d video_jobs_db -f sql/create_tables.sql

      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7